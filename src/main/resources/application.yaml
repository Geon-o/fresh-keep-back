spring:
  application:
    name: fresh-keep
  profiles:
    active: local
  security:
    # Basic security configurations if any

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000

security:
  # 연동 코드/기기 UUID HMAC 해싱용 서버 비밀키. 절대 커밋하지 말고 환경변수로 주입.
  hmac-secret: ${HMAC_SECRET}




server:
  port: 8086
  forward-headers-strategy: framework
---
# Local Development (using H2)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 로컬 개발 편의: 웹/Expo 패키저/클라우드플레어 터널 등 허용
app:
  cors:
    allowed-origin-patterns:
      - "http://localhost:[*]"
      - "http://127.0.0.1:[*]"
      - "http://192.168.*.*:[*]"
      - "https://*.trycloudflare.com"

---
# Production / Server (using MariaDB)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # TODO(보안): 최초 스키마 생성 후 Flyway/Liquibase 도입하고 validate 로 전환할 것.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# 운영: 반드시 실제 프론트엔드 도메인만 지정한다. 콤마로 구분된 환경변수로 주입.
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:}
